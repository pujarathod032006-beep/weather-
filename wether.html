<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      text-align: center;
      padding: 50px;
      color: #333;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #0077cc;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005fa3;
    }

    #weatherResult {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>🌤️ Simple Weather App</h1>

  <input type="text" id="locationInput" placeholder="Enter city (e.g. London)">
  <button onclick="getWeather()">Get Weather</button>

  <div id="weatherResult"></div>

  <script>
    function getWeather() {
      const location = document.getElementById("locationInput").value;
      const apiKey = "8d8ab97317f64895a5a183436250907";
      const url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${encodeURIComponent(location)}&aqi=yes`;

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          return response.json();
        })
        .then(data => {
          const temperature = data.current.temp_c;
          const condition = data.current.condition.text;
          document.getElementById("weatherResult").innerHTML =
            `<p>🌍 Location: <strong>${data.location.name}, ${data.location.country}</strong></p>
             <p>🌡️ Temperature: <strong>${temperature}°C</strong></p>
             <p>☁️ Condition: <strong>${condition}</strong></p>`;
        })
        .catch(error => {
          document.getElementById("weatherResult").innerHTML =
            `<p style="color: red;">❌ Could not fetch weather data. Please check the city name.</p>`;
          console.error("Error fetching weather data:", error);
        });
    }
  </script>

</body>
</html>
